
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マナの森</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="game-header">
    <h1>マナの森</h1>
    <p>MANA FOREST</p>
  </header>

  <main class="game-container">

    <!-- 共通ステータス -->
    <section class="status-area">
      <div class="status-item">
        <span>所持コイン</span>
        <strong id="coins">0</strong>
      </div>

      <div class="status-item">
        <span>採集能力</span>
        <strong id="gathering-level">0</strong>
      </div>

      <div class="status-item">
        <span>インベントリ</span>
        <strong id="inventory-count">0 / 10</strong>
      </div>
    </section>

    <!-- 採集画面 -->
    <section id="gather-screen" class="game-screen active">

      <section class="panel gather-area">
        <h2>🌳 ひだまりの森</h2>
        <p>森の中を探索して、素材を採集しましょう。</p>

        <button id="gather-button" class="main-button">
          素材を採集する
        </button>

        <div id="gather-result" class="result-box">
          ここに採集結果が表示されます。
        </div>
      </section>

      <!-- インベントリ拡張 -->
      <section class="panel upgrade-area">
        <h2>🎒 インベントリ拡張</h2>

        <div class="upgrade-info">
          <div>
            <span>現在の容量</span>
            <strong id="current-capacity">10枠</strong>
          </div>

          <div>
            <span>次の拡張</span>
            <strong id="next-capacity">15枠</strong>
          </div>

          <div>
            <span>拡張費用</span>
            <strong id="capacity-cost">200コイン</strong>
          </div>
        </div>

        <button id="expand-button" class="main-button">
          容量を拡張する
        </button>

        <p id="expand-message" class="help-text">
          コインを使って所持容量を増やせます。
        </p>
      </section>

    </section>

    <!-- インベントリ画面 -->
    <section id="inventory-screen" class="game-screen">

      <section class="panel inventory-area">
        <h2>🎒 インベントリ</h2>

        <p class="inventory-description">
          所持している素材を確認できます。
        </p>

        <div id="inventory-list" class="inventory-list">
          まだ素材を持っていません。
        </div>
      </section>

    </section>
    
    <!-- 個体詳細画面 -->
    <div id="item-modal" class="item-modal">
      <div class="item-modal-content">

        <div class="item-modal-header">
          <h2>素材の詳細</h2>
          <button id="close-modal-button" class="close-modal-button">
          ×
          </button>
        </div>

        <div class="item-detail-info">
          <div>
            <span>素材名</span>
            <strong id="detail-name">若葉</strong>
          </div>

          <div>
            <span>レアリティ</span>
            <strong id="detail-rarity">フローラ</strong>
          </div>

          <div>
            <span>マナ</span>
            <strong id="detail-value">30</strong>
          </div>
        </div>

        <div class="item-detail-info">
          <div>
            <span>売却金額</span>
            <strong id="detail-sell-price">9コイン</strong>
          </div>

          <div>
            <span>強化量</span>
            <strong id="detail-upgrade-value">+0.9</strong>
          </div>

          <div>
            <span>強化費用</span>
            <strong id="detail-upgrade-cost">300コイン</strong>
          </div>
        </div>

        <p id="detail-message" class="help-text"></p>

        <button id="sell-button" class="main-button">
          売却する
        </button>

        <button id="upgrade-button" class="main-button">
          強化する
        </button>

      </div>
    </div>
  </main>

  <!-- 下部タブ -->
  <nav class="bottom-nav">
    <button class="nav-button active" data-screen="gather-screen">
      <span class="nav-icon">🌳</span>
      <span>採集</span>
    </button>

    <button class="nav-button" data-screen="inventory-screen">
      <span class="nav-icon">🎒</span>
      <span>インベントリ</span>
    </button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
