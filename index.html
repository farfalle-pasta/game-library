

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME LIBRARY</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <h1>GAME LIBRARY</h1>
    <p>小さなゲームのコレクション</p>
  </header>

  <main class="container">

    <section class="game-card">
      <img
        src="assets/images/game-001.png"
        alt="森の素材採集ゲーム"
        class="game-thumbnail"
      >

      <div class="game-info">
        <div class="game-heading">
          <h2>森の素材採集ゲーム</h2>
          <span class="status">公開中</span>
        </div>

        <div class="genres">
          <span>採集</span>
          <span>育成</span>
          <span>カジュアル</span>
        </div>

        <details>
          <summary>ゲームの説明</summary>
          <p>
            森を探索して素材を集め、
            売却や強化を楽しむゲームです。
          </p>
        </details>

        <details>
          <summary>遊び方</summary>
          <p>
            エリアを選んで素材を採集しましょう。
            集めた素材を売却し、強化を進めていきます。
          </p>
        </details>

        <a href="games/game-001/" class="play-button">
          遊ぶ
        </a>
      </div>
    </section>

  </main>

  <footer>
    <p>GAME LIBRARY</p>
  </footer>

</body>
</html>
